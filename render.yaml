services:
  - type: web
    name: learning-app-backend
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt ; python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi --log-file -
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12"
    healthCheckPath: /admin/
    autoDeploy: false
